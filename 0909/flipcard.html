<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .flipcard{
      width: 300px;
      height: 300px;
      border: 1px solid gainsboro;
      perspective: 1000px;
    }
    .flipcard-inner{
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform .8s;
      transform-style: preserve-3d;
      /*transform-style 속성은 요소의 자식요소가 입체적인 3d공간에 배치될지, 
      요소의 표면에 평평하게 묘사할 지를 결정한다.
      flat-기본값 perserv-3d를 지정하면 3d공간에 배치된다.*/
    }
    /* 수평으로 뒤집힘 */
    .flipcard:hover .flipcard-inner{
      transform: rotateY(180deg);
    }
    .flipcard-front, .flipcard-back{
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
    }
    .flipcard-back{
      transform: rotateY(180deg);
      background-color: darkcyan;
      color: aliceblue;
    }
  </style>
</head>
<body>
  <div class="flipcard">
    <div class="flipcard-inner">
      <div class="flipcard-front">
        <img src="https://picsum.photos/300/" alt="">
      </div>
      <div class="flipcard-back">
        <h1>John Doe</h1>
        <p>architect Engineer</p>
        <p>i'm so tired</p>
      </div>
    </div>
  </div></body>
</html>
