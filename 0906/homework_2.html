<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>숙제 답</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }
    ul,li{
      list-style: none;
    }
    .container{
      width: 100%;
      min-width: 1000px;
      height: 920px;
      background: url(/이미지예제/unsplash/image1.jpg) center/cover;
      position: relative;
    }
    .txt{
      width: 560px;
      padding: 20px;
      background-color: rgb(255, 255, 255, 0.5);
      border-radius: 20px;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #333;
    }
    h1{
      font-size: 72px;
      margin-bottom: 20px;
    }
    p{
      font-size: 24px;
      line-height: 1.5em;
      font-weight: bold;
    }
    .thumbs{
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: -85px;
      display: flex;
      border: 5px solid black;
      background-color: rgb(0, 0, 0);
    }
    .thumbs li+li{
      border-left: 5px solid black;
    }
    img{
      display: block;
      object-fit: cover;
      cursor: pointer;
    }
    .thumbs img:hover{
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="txt">
      <h1>Logo Here</h1>
      <p>Lorem ipsum dolor sit amet consectetur <br>adipisicing elit. 
        Accusantium ipsa quis, pra </p>
    </div>
    <ul class="thumbs">
      <li><img width="220" height="160" src="/이미지예제/unsplash/image2.jpg" alt=""></li>
      <li><img width="220" height="160" src="/이미지예제/unsplash/image1.jpg" alt=""></li>
      <li><img width="220" height="160" src="/이미지예제/unsplash/image3.jpg" alt=""></li>
      <li><img width="220" height="160" src="/이미지예제/unsplash/image4.jpg" alt=""></li>
    </ul>
  </div>
</body>
</html>
